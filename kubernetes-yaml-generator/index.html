<section class="glass-panel tool-container" aria-labelledby="tool-title">

        <div class="panel-box">
            <div class="panel-title"><span><i class="fa-solid fa-sliders"></i> Resource Config</span></div>
            
            <div class="form-group">
                <label for="resourceType">Resource Type</label>
                <select id="resourceType" class="styled-select" onchange="switchResourceSection()" aria-label="Select Kubernetes Target Resource Type">

<script>
    // Handle conditional fields visibility blocks states shifts cleanly
    function switchResourceSection() {
        const selectedType = document.getElementById('resourceType').value;
        
        // Disable visibility structures parameters completely across the stack
        document.querySelectorAll('.dynamic-section').forEach(section => {
            section.classList.remove('active');
        });

        // Activate core selected layout target component context layer
        document.getElementById(`section-${selectedType}`).classList.add('active');
        generateYAMLManifest();
    }

    // High performance orchestration rendering engine loop strategy execution rules
    function generateYAMLManifest() {
        const type = document.getElementById('resourceType').value;
        const name = document.getElementById('manifestName').value.trim() || 'app-resource';
        const namespace = document.getElementById('manifestNamespace').value.trim() || 'default';
        const outputTextArea = document.getElementById('yamlOutput');

        let yamlOutput = '';

        // Strategic construction routing matching resource specification rules
        if (type === 'deployment') {
            const replicas = document.getElementById('deployReplicas').value || 1;
            const image = document.getElementById('deployImage').value.trim() || 'nginx:latest';
            const port = document.getElementById('deployPort').value || 80;

            yamlOutput = `apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${name}
  namespace: ${namespace}
  labels:
    app: ${name}
spec:
  replicas: ${replicas}
  selector:
    matchLabels:
      app: ${name}
  template:
    metadata:
      labels:
        app: ${name}
    spec:
      containers:
      - name: container
        image: ${image}
        ports:
        - containerPort: ${port}`;

        } else if (type === 'service') {
            const svcType = document.getElementById('svcType').value;
            const port = document.getElementById('svcPort').value || 80;
            const targetPort = document.getElementById('svcTargetPort').value || 80;

            yamlOutput = `apiVersion: v1
kind: Service
metadata:
  name: ${name}
  namespace: ${namespace}
spec:
  type: ${svcType}
  selector:
    app: ${name}
  ports:
  - protocol: TCP
    port: ${port}
    targetPort: ${targetPort}`;

        } else if (type === 'ingress') {
            const host = document.getElementById('ingHost').value.trim() || 'app.example.com';
            const svcName = document.getElementById('ingSvcName').value.trim() || 'web-service';
            const svcPort = document.getElementById('ingSvcPort').value || 80;

            yamlOutput = `apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${name}
  namespace: ${namespace}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: ${host}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${svcName}
            port:
              number: ${svcPort}`;

        } else if (type === 'configmap') {
            const cmKey = document.getElementById('cmKey').value.trim() || 'key';
            const cmValue = document.getElementById('cmValue').value.trim() || 'value';

            yamlOutput = `apiVersion: v1
kind: ConfigMap
metadata:
  name: ${name}
  namespace: ${namespace}
data:
  ${cmKey}: "${cmValue}"`;

        } else if (type === 'secret') {
            const secretKey = document.getElementById('secretKey').value.trim() || 'key';
            const secretValue = document.getElementById('secretValue').value.trim() || 'value';
            
            // Auto Base64 encoding for structural Kubernetes compliance rules
            let encodedValue = '';
            try {
                encodedValue = btoa(unescape(encodeURIComponent(secretValue)));
            } catch(e) {
                encodedValue = btoa(secretValue);
            }

            yamlOutput = `apiVersion: v1
kind: Secret
metadata:
  name: ${name}
  namespace: ${namespace}
type: Opaque
data:
  ${secretKey}: ${encodedValue}`;
        }

        // Output raw data configuration context mapping properties definitions
        outputTextArea.value = yamlOutput;
    }

    // Clipboard pipeline system communication logic interaction
    function copyYAMLOutput() {
        const outputArea = document.getElementById('yamlOutput');
        if (!outputArea.value) return;

        navigator.clipboard.writeText(outputArea.value).then(() => {
            const copyBtn = document.querySelector('[onclick="copyYAMLOutput()"]');
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
            }, 2000);
        });
    }

    // Trigger calculation sequence loop mapping elements instantly upon initial document initialized loaded
    window.addEventListener('DOMContentLoaded', () => {
        generateYAMLManifest();
    });
</script>
