<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dynamic Title (Each page's title will be updated here) -->
    <title>{% block title %}DevOpsVaultX | DevOps Tools Hub{% endblock %}</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N2W1QDP3V3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-N2W1QDP3V3');
    </script>
        
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon/favicon-96x96.png') }}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon/favicon.svg') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />
    <meta name="apple-mobile-web-app-title" content="DevOpsVaultX" />
    <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}" />
        
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Each tool's unique CSS and Meta Tags will be included here -->
    {% block head %}{% endblock %}
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Common Navbar -->
    <header class="glass-nav">
        <div class="container nav-content">
            <a href="/" class="logo-group" aria-label="Home">
                <div class="logo-icon" aria-hidden="true">
                    <i class="fa-solid fa-cube"></i>
                    <span class="ping-indicator"></span>
                </div>
                <div class="logo-text">DevOpsVault<span class="highlight-x">X</span></div>
            </a>
            <a href="https://www.youtube.com/@devopsvaultx?sub_confirmation=1" target="_blank" rel="noopener noreferrer" class="premium-btn" aria-label="Visit our YouTube channel">
                <i class="fa-brands fa-youtube" style="color: #ff2a5f;" aria-hidden="true"></i> SUBSCRIBE
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Common Footer -->
    <footer class="glass-footer">
        <div class="container footer-center">
            <p>&copy; 2026 <strong>DevOpsVaultX</strong> <span class="divider">|</span> <span class="text-gradient">Code. Deploy. Automate. Repeat.</span> <i class="fa fa-heart heartbeat" aria-hidden="true"></i></p>
        </div>
    </footer>

    <!-- Common JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <!-- Each tool's unique JS scripts will be included here -->
    {% block scripts %}{% endblock %}
</body>
</html>
