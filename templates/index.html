<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOpsVaultX | Premium Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header class="glass-nav">
        <div class="container nav-content">
            <a href="/" class="logo-group" aria-label="Home">
                <div class="logo-icon" aria-hidden="true">
                    <i class="fa-solid fa-cube"></i>
                    <span class="ping-indicator"></span>
                </div>
                <div class="logo-text">DevOpsVault<span class="highlight-x">X</span></div>
            </a>
            <a href="https://youtube.com/" target="_blank" rel="noopener noreferrer" class="premium-btn" aria-label="Visit our YouTube channel">
                <i class="fa-brands fa-youtube" style="color: #ff2a5f;" aria-hidden="true"></i> Vault Studio
            </a>
        </div>
    </header>

    <section class="hero-section">
        <div class="container text-center">
            <div class="status-badge">
                <span class="status-dot"></span> Active Resources Platform
            </div>
            <h1 class="hero-title">
                <span id="type-line-1"></span><br>
                <span id="type-line-2" class="text-gradient"></span>
            </h1>
            <p class="hero-subtitle">
                Your all-in-one daily toolkit for fast, serverless utility generation. Secure, browser-based, and lightning fast.
            </p>
        </div>
    </section>

    <main class="container main-content">
        <div class="control-panel glass-panel">
            <div class="tabs" role="tablist">
                <button onclick="setCategory('all')" id="tab-all" class="tab-btn active" role="tab">📂 All Tools</button>
                <button onclick="setCategory('k8s')" id="tab-k8s" class="tab-btn" role="tab"><i class="fa-solid fa-font text-warning" aria-hidden="true"></i> Text</button>
                <button onclick="setCategory('cloud')" id="tab-cloud" class="tab-btn" role="tab"><i class="fa-solid fa-image text-warning" aria-hidden="true"></i> Images</button>
                <button onclick="setCategory('cicd')" id="tab-cicd" class="tab-btn" role="tab"><i class="fa-solid fa-arrows-rotate text-warning" aria-hidden="true"></i> Others</button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="engine-search" onkeyup="filterHub()" placeholder="Search utilities..." aria-label="Search tools and utilities">
            </div>
        </div>

        <div id="grid-container" class="bento-grid" role="region" aria-label="Tools Grid"></div>

        <div id="no-results" class="empty-state hidden" aria-live="polite">
            <i class="fa-solid fa-ghost empty-icon" aria-hidden="true"></i>
            <p>No tools match your search criteria.</p>
            <button onclick="clearSearchFilters()" class="premium-btn primary-btn">Reset Filters</button>
        </div>
    </main>

    <footer class="glass-footer">
        <div class="container footer-center">
            <p>&copy; 2026 <strong>DevOpsVaultX</strong> <span class="divider">|</span> <span class="text-gradient">Code. Deploy. Automate. Repeat.</span> <i class="fa fa-heart heartbeat" aria-hidden="true"></i></p>
        </div>
    </footer>

    <script src="static/script.js"></script>
</body>
</html>
