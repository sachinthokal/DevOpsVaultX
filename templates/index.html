{% extends 'base.html' %}

{% block content %}
<section class="hero-section">
    <div class="container text-center">
        <div class="status-badge">
            <span class="status-dot"></span> Active Resources Platform
        </div>
        <h1 class="hero-title">
            <span id="type-line-1"></span><br>
            <span id="type-line-2" class="text-gradient"></span>
        </h1>
        <p class="hero-subtitle">
            Your all-in-one daily toolkit for fast, serverless utility generation. Secure, browser-based, and lightning fast.
        </p>
    </div>
</section>

<div class="control-panel glass-panel">
    <div class="tabs" role="tablist">
        <button onclick="setCategory('all')" id="tab-all" class="tab-btn active" role="tab">📂 All Tools</button>
        <button onclick="setCategory('text')" id="tab-text" class="tab-btn" role="tab"><i class="fa-solid fa-font text-warning" aria-hidden="true"></i>&nbsp; &nbsp; Text</button>
        <button onclick="setCategory('img')" id="tab-img" class="tab-btn" role="tab"><i class="fa-solid fa-image text-warning" aria-hidden="true"></i>&nbsp; &nbsp; Images</button>
        <button onclick="setCategory('others')" id="tab-others" class="tab-btn" role="tab"><i class="fa-solid fa-arrows-rotate text-warning" aria-hidden="true"></i>&nbsp; &nbsp; Others</button>
    </div>
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
        <input type="text" id="engine-search" onkeyup="filterHub()" placeholder="search tools and utilities..." aria-label="Search tools and utilities">
    </div>
</div>

<div id="grid-container" class="bento-grid" role="region" aria-label="Tools Grid"></div>

<div id="no-results" class="empty-state hidden" aria-live="polite">
    <i class="fa-solid fa-ghost empty-icon" aria-hidden="true"></i>
    <p>No tools match your search criteria.</p>
    <button onclick="clearSearchFilters()" class="premium-btn primary-btn">Reset Filters</button>
</div>
{% endblock %}
