<script>
    // Configuration definition Matrix schema database structure elements
    const unitDatabase = {
        data: {
            label: "Data Storage",
            units: { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 },
            display: { B: "Bytes (B)", KB: "Kilobytes (KB)", MB: "Megabytes (MB)", GB: "Gigabytes (GB)", TB: "Terabytes (TB)" },
            defaults: ["MB", "GB"]
        },
        time: {
            label: "Time Periods",
            units: { ms: 1, sec: 1000, min: 60000, hour: 3600000, day: 86400000 },
            display: { ms: "Milliseconds (ms)", sec: "Seconds (sec)", min: "Minutes (min)", hour: "Hours (hour)", day: "Days (day)" },
            defaults: ["ms", "sec"]
        },
        length: {
            label: "Length Metric",
            units: { mm: 0.001, cm: 0.01, meter: 1, km: 1000, inch: 0.0254, feet: 0.3048, yard: 0.9144, mile: 1609.344 },
            display: { mm: "Millimeters (mm)", cm: "Centimeters (cm)", meter: "Meters (m)", km: "Kilometers (km)", inch: "Inches (in)", feet: "Feet (ft)", yard: "Yards (yd)", mile: "Miles (mi)" },
            defaults: ["inch", "feet"]
        },
        weight: {
            label: "Weight / Mass",
            units: { mg: 0.001, gram: 1, kg: 1000, ounce: 28.349523125, pound: 453.59237 },
            display: { mg: "Milligrams (mg)", gram: "Grams (g)", kg: "Kilograms (kg)", ounce: "Ounces (oz)", pound: "Pounds (lb)" },
            defaults: ["kg", "pound"]
        },
        temp: {
            label: "Temperature Strategy",
            units: { C: "Celsius", F: "Fahrenheit", K: "Kelvin" },
            display: { C: "Celsius (°C)", F: "Fahrenheit (°F)", K: "Kelvin (K)" },
            defaults: ["C", "F"]
        }
    };

    let activeCategory = 'data';

    // Switch layout interface states cleanly
    function switchCategory(category) {
        activeCategory = category;
        
        // Toggle system tab elements visibility states and manage ARIA states dynamically
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.setAttribute('aria-selected', 'false');
        });
        
        const activeTab = document.getElementById(`tab-${category}`);
        activeTab.classList.add('active');
        activeTab.setAttribute('aria-selected', 'true');

        const selectFrom = document.getElementById('unitFrom');
        const selectTo = document.getElementById('unitTo');
        
        selectFrom.innerHTML = '';
        selectTo.innerHTML = '';

        const data = unitDatabase[category];
        
        // Populate standard options configurations
        Object.keys(data.units).forEach(key => {
            const text = data.display[key];
            selectFrom.add(new Option(text, key));
            selectTo.add(new Option(text, key));
        });

        // Map safe baseline parameters
        selectFrom.value = data.defaults[0];
        selectTo.value = data.defaults[1];

        document.getElementById('valFrom').value = 1;
        performCalculation();
    }

    // High performance analytical system computation handler functions routine
    function performCalculation() {
        const fromUnit = document.getElementById('unitFrom').value;
        const toUnit = document.getElementById('unitTo').value;
        const inputValStr = document.getElementById('valFrom').value;
        const outputEl = document.getElementById('valTo');
        const formulaEl = document.getElementById('formulaDisplay');

        if (inputValStr === "") {
            outputEl.value = "";
            return;
        }

        const inputVal = parseFloat(inputValStr);
        let outputVal = 0;

        // Custom specialized computation branch processing for Temperature attributes rules
        if (activeCategory === 'temp') {
            let baseCelsius = 0;
            
            // Map configuration state explicitly into Celsius standard reference framework values
            if (fromUnit === 'C') baseCelsius = inputVal;
            else if (fromUnit === 'F') baseCelsius = (inputVal - 32) * 5 / 9;
            else if (fromUnit === 'K') baseCelsius = inputVal - 273.15;

            // Route standard references into objective layout dimensions targets values
            if (toUnit === 'C') outputVal = baseCelsius;
            else if (toUnit === 'F') outputVal = (baseCelsius * 9 / 5) + 32;
            else if (toUnit === 'K') outputVal = baseCelsius + 273.15;

            formulaEl.textContent = `Temperature Mapping Calculations Route: [${fromUnit}] to [${toUnit}]`;
        } else {
            // General structural matrix multiplier baseline data storage calculation loops routines
            const factors = unitDatabase[activeCategory].units;
            const valueInBase = inputVal * factors[fromUnit];
            outputVal = valueInBase / factors[toUnit];

            // Build clear context tracking description summaries rules
            const ratio = factors[fromUnit] / factors[toUnit];
            formulaEl.textContent = `1 ${fromUnit} = ${ratio.countDigits() > 5 ? ratio.toFixed(5) : ratio} ${toUnit}`;
        }

        // Clean precision decimal format trimming attributes rules parameters execution
        outputEl.value = Number(outputVal.toFixed(6)).toString();
    }

    // Swap parameters workflow states smoothly matching matrix orientation maps
    function swapUnits() {
        const fromEl = document.getElementById('unitFrom');
        const toEl = document.getElementById('unitTo');
        const temp = fromEl.value;
        
        fromEl.value = toEl.value;
        toEl.value = temp;
        
        performCalculation();
    }

    // Number helper method to safely analyze decimal string constraints lengths cleanly
    Number.prototype.countDigits = function () {
        if (Math.floor(this.valueOf()) === this.valueOf()) return 0;
        return this.toString().split(".")[1].length || 0;
    }

    // Load initial layout elements structures cleanly upon initialization pipeline completed
    window.addEventListener('DOMContentLoaded', () => {
        switchCategory('data');
    });
</script>
