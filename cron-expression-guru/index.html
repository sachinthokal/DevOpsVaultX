<script>
    // Pure JS parser definitions for standard fields matrix mapping
    function translateCronParts(parts) {
        let min, hour, dom, month, dow;
        
        if (parts.length === 6) {
            [, min, hour, dom, month, dow] = parts; 
        } else {
            [min, hour, dom, month, dow] = parts;
        }

        let desc = "Runs ";

        // Minutes Translation
        if (min === '*') desc += "every minute";
        else if (min.startsWith('*/')) desc += `every ${min.split('/')[1]} minutes`;
        else desc += `at minute ${min}`;

        // Hours Translation
        if (hour !== '*') {
            if (hour.startsWith('*/')) desc += `, every ${hour.split('/')[1]} hours`;
            else desc += `, at hour ${hour}`;
        }

        // Days setup
        if (dom !== '*') desc += `, on day of month ${dom}`;
        if (month !== '*') desc += `, in month ${month}`;

        // Weeks logic setup
        if (dow !== '*') {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            desc += `, on ${dow.split(',').map(d => days[d] || d).join(', ')}`;
        }

        return desc + " (UTC).";
    }

    // Advanced Robust Scheduler Engine for UTC Timeline Generation
    function parseCron() {
        const rawInput = document.getElementById('cronInput').value.trim();
        const input = rawInput.replace(/\s+/g, ' ');
        
        const translationEl = document.getElementById('cronTranslation');
        const timelineEl = document.getElementById('scheduleTimeline');

        if (!input) {
            translationEl.textContent = "Please enter a cron pattern.";
            if (timelineEl) timelineEl.innerHTML = "";
            return;
        }

        const parts = input.split(' ');
        if (parts.length < 5 || parts.length > 6) {
            translationEl.textContent = "Invalid cron format (Requires 5 standard fields or 6 extended fields).";
            translationEl.style.color = "var(--danger)";
            if (timelineEl) timelineEl.innerHTML = "";
            return;
        }

        try {
            translationEl.textContent = translateCronParts(parts);
            translationEl.style.color = "#10b981"; 

            let minPart = parts.length === 6 ? parts[1] : parts[0];
            let hourPart = parts.length === 6 ? parts[2] : parts[1];
            let dowPart = parts.length === 6 ? parts[5] : parts[4];

            // 1. Generate array of valid minutes (0-59)
            let validMinutes = [];
            if (minPart === '*') {
                for (let i = 0; i < 60; i++) validMinutes.push(i);
            } else if (minPart.startsWith('*/')) {
                let step = parseInt(minPart.split('/')[1]) || 15;
                for (let i = 0; i < 60; i += step) validMinutes.push(i);
            } else {
                validMinutes = minPart.split(',').map(x => parseInt(x));
            }

            // 2. Generate array of valid hours (0-23)
            let validHours = [];
            if (hourPart === '*') {
                for (let i = 0; i < 24; i++) validHours.push(i);
            } else if (hourPart.startsWith('*/')) {
                let step = parseInt(hourPart.split('/')[1]) || 1;
                for (let i = 0; i < 24; i += step) validHours.push(i);
            } else {
                validHours = hourPart.split(',').map(x => parseInt(x));
            }

            // 3. Generate array of valid days of the week (0-6) [0=Sunday]
            let validDaysOfWeek = [];
            if (dowPart === '*') {
                for (let i = 0; i < 7; i++) validDaysOfWeek.push(i);
            } else {
                validDaysOfWeek = dowPart.split(',').map(x => parseInt(x));
            }

            const dates = [];
            let current = new Date();
            
            // Clear seconds and milliseconds to ensure accurate calculations
            current.setUTCSeconds(0, 0);
            
            // Advance by 1 minute to calculate strictly upcoming executions
            current.setUTCMinutes(current.getUTCMinutes() + 1);

            // Set iteration limits to ensure extensive timeline evaluation for weekly/monthly schedules
            let loopGuard = 0;
            const maxIterations = 100000; 

            while (dates.length < 5 && loopGuard < maxIterations) {
                loopGuard++;

                let h = current.getUTCHours();
                let m = current.getUTCMinutes();
                let d = current.getUTCDay();

                // Validate current timestamp against all cron boundary filters simultaneously
                if (validMinutes.includes(m) && validHours.includes(h) && validDaysOfWeek.includes(d)) {
                    dates.push(new Date(current));
                }

                current.setUTCMinutes(current.getUTCMinutes() + 1);
            }

            // Render execution steps cleanly onto the output pipeline timeline container
            if (timelineEl) {
                timelineEl.innerHTML = "";
                if (dates.length === 0) {
                    timelineEl.innerHTML = `<li class="schedule-item"><span>No upcoming executions found.</span></li>`;
                } else {
                    dates.forEach((date, index) => {
                        const li = document.createElement('li');
                        li.className = 'schedule-item';
                        
                        // ISO Format conversion mapped explicitly for uniform UTC string display
                        const utcString = date.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
                        
                        li.innerHTML = `
                            <span>Next execution #${index + 1}</span>
                            <strong>${utcString}</strong>
                        `;
                        timelineEl.appendChild(li);
                    });
                }
            }

        } catch (e) {
            translationEl.textContent = "Invalid cron expression formatting syntax.";
            translationEl.style.color = "var(--danger)";
            if (timelineEl) timelineEl.innerHTML = "";
        }
    }

    function setPreset(pattern) {
        document.getElementById('cronInput').value = pattern;
        parseCron();
    }

    window.addEventListener('DOMContentLoaded', () => {
        parseCron();
    });
</script>
