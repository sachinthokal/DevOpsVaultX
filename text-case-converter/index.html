<!-- JS Logic -->
<script>
    const textInput = document.getElementById('textInput');
    
    function updateStats() {
        const text = textInput.value;
        document.getElementById('charCount').textContent = text.length;
        const words = text.trim().split(/\s+/).filter(word => word.length > 0);
        document.getElementById('wordCount').textContent = words.length;
    }

    function convertCase(type) {
        let text = textInput.value;
        if (!text) return;

        switch(type) {
            case 'upper': text = text.toUpperCase(); break;
            case 'lower': text = text.toLowerCase(); break;
            case 'title': text = text.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); break;
            case 'sentence': text = text.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase()); break;
            case 'alternating': text = text.toLowerCase().split('').map((c, i) => i % 2 === 0 ? c : c.toUpperCase()).join(''); break;
            case 'camel': text = text.replace(/(?:^\w|[A-Z]|\b\w)/g, (word, index) => index === 0 ? word.toLowerCase() : word.toUpperCase()).replace(/\s+/g, ''); break;
        }
        
        textInput.value = text;
        updateStats();
    }

    function clearText() { textInput.value = ''; updateStats(); textInput.focus(); }

    function copyToClipboard() {
        if (!textInput.value) return;
        navigator.clipboard.writeText(textInput.value).then(() => {
            const btn = document.getElementById('copyBtn');
            const feedback = document.getElementById('copyFeedback');
            
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            btn.style.background = 'var(--accent)'; btn.style.borderColor = 'var(--accent)';
            feedback.classList.remove('hidden');

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy to Clipboard';
                btn.style.background = 'var(--primary)'; btn.style.borderColor = 'var(--primary)';
                feedback.classList.add('hidden');
            }, 2000);
        });
    }
</script>
